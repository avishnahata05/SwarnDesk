[build]
  base    = "."
  command = "npm install -g pnpm@9 && pnpm install --no-frozen-lockfile && pnpm --filter @workspace/hiranxt run build"
  publish = "artifacts/hiranxt/dist/public"

[build.environment]
  BASE_PATH = "/"
  NODE_VERSION = "20"

# Proxy /api/* calls to the Render backend — replace the URL below after deploying
[[redirects]]
  from   = "/api/*"
  to     = "https://YOUR-APP-NAME.onrender.com/api/:splat"
  status = 200
  force  = true

# SPA fallback — all other routes serve index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
